<html>
  <head>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: auto;
        padding: 30px;
      }
      .header {
        text-align: center;
        margin-bottom: 30px;
        border-bottom: 2px solid #f0f0f0;
        padding-bottom: 20px;
      }
      .header h1 {
        margin: 0;
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .news-item {
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
      }
      .news-item:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
      .news-title {
        display: block;
        font-size: 18px;
        font-weight: 600;
        color: #007bff;
        text-decoration: none;
        margin-bottom: 8px;
      }
      .news-title:hover {
        text-decoration: underline;
        color: #0056b3;
      }
      .news-summary {
        font-size: 15px;
        color: #555;
        margin-bottom: 12px;
      }
      .news-meta {
        font-size: 12px;
        color: #999;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .news-source {
        font-weight: bold;
        color: #777;
        background: #eee;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .footer {
        text-align: center;
        font-size: 12px;
        color: #aaa;
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Latest News</h1>
      </div>
      <div class="news-items-wrapper">{{NEWS_ITEMS}}</div>
      <div class="footer">
        <p>Generated by Agent News Alert</p>
      </div>
    </div>
  </body>
</html>
